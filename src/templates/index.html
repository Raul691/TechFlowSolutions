<!DOCTYPE html>
<html>
<head>
    <title>Gerenciador de Tarefas</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<h1>📋 Gerenciador de Tarefas</h1>

<form method="POST" action="/tarefas_web">
    <input type="text" name="nome" placeholder="Nome da tarefa" required>
    <input type="text" name="status" placeholder="Status">
    <input type="text" name="prioridade" placeholder="Prioridade">
    <br>
    <button type="submit" class="btn-add">Adicionar</button>
</form>

<hr>

{% for t in tarefas %}
<div class="tarefa">
    <p><strong>{{ t.nome }}</strong></p>
    <p>Status: {{ t.status }}</p>
    <p>Prioridade: {{ t.prioridade }}</p>

    <form action="/deletar/{{ loop.index0 }}" method="POST">
        <button type="submit" class="btn-delete">Deletar</button>
    </form>
</div>
{% else %}
<p>Nenhuma tarefa cadastrada</p>
{% endfor %}

</body>
</html>
